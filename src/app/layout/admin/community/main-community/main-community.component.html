@if (isBrowser) {
<div class="mx-auto max-w-7xl min-h-screen bg-background-light dark:bg-background-dark transition-colors duration-300">

    <ng-container #container></ng-container>

    <!-- Header flotante con efecto sutil de cristal -->
    <header
        class="sticky top-0 w-full py-3 px-4 text-xs bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-10 border-b border-zinc-200/50 dark:border-secondary-900/40">

        <div class="flex justify-between items-center space-x-5 h-12">

            <!-- Botón de retroceso estilizado con acento fucsia al hacer hover -->
            <button (click)="goBack()"
                class="cursor-pointer flex items-center justify-center w-10 h-10 rounded-full transition duration-300 ease-in-out hover:bg-primary-50 dark:hover:bg-secondary-900 text-zinc-600 dark:text-zinc-300 hover:text-primary-500">
                <i appIcon iconName="arrow-back-regular" [size]="'w-6 h-6'" [color]="''" class="flex-shrink-0 pl-1"></i>
            </button>

            <!-- Título de comunidad con tipografía y color alineados al branding -->
            <button (click)="onScrollTop()"
                class="cursor-pointer flex items-center justify-center px-4 py-2 text-sm font-bold text-center text-zinc-800 dark:text-zinc-100 uppercase tracking-wider rounded-full transition duration-300 ease-in-out hover:bg-primary-50 dark:hover:bg-secondary-900">
                <span>{{'myCommunity' | translate}}</span>
            </button>
        </div>
    </header>

    <!-- Navegación por pestañas (Píldora contenedora con estética oscura / violeta) -->
    <ul
        class="flex gap-2 mx-4 mt-4 p-1.5 bg-zinc-100 dark:bg-secondary-950/80 backdrop-blur-xl rounded-2xl mb-6 border border-zinc-200/80 dark:border-secondary-900 shadow-lg dark:shadow-secondary-950/50">
        @for (link of links(); track $index) {
        <li class="flex-1 list-none">
            <a [routerLink]="link.path" [routerLinkActiveOptions]="{ exact: false }"
                routerLinkActive="bg-white dark:bg-secondary-900 text-primary-500 dark:text-primary-400 shadow-md dark:shadow-primary-950/30 active-state font-bold"
                (click)="onLinkClick(link)"
                class="relative flex items-center justify-center h-11 px-4 rounded-xl text-zinc-500 dark:text-zinc-400 font-medium text-sm transition-all duration-300 ease-out hover:text-primary-500 dark:hover:text-primary-300 group">

                <span class="relative z-10 truncate transition-transform duration-200 group-active:scale-95">
                    {{ link.title | translate }}
                </span>

                <!-- Indicador inferior (neón fucsia) cuando está activo -->
                <span routerLinkActive="w-1/3 opacity-100 shadow-[0_0_10px_rgba(230,0,103,0.5)]"
                    class="absolute bottom-1.5 left-1/2 -translate-x-1/2 h-[3px] w-0 bg-primary-500 rounded-full opacity-0 transition-all duration-300 ease-in-out">
                </span>
            </a>
        </li>
        }
    </ul>

    <!-- Contenedor del contenido principal de las vistas hijas -->
    <div class="mx-4 mb-16">
        <router-outlet></router-outlet>
    </div>

</div>
}
