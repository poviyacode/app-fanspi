@if (dialogService.activeModal() === 'infoPersonalPay') {
<div [ngClass]="modalClass()" (click)="$event.stopPropagation()" @flyInOut>
  <section class="p-4 sm:p-6 overflow-y-auto max-h-[100vh]">
    <!-- PERSONAL -->
    <form [formGroup]="myFormPersonal" (ngSubmit)="onSubmit()" id="form" novalidate autocomplete="off"
      class="space-y-4">

      <fieldset class="font-bold uppercase">
        {{'personalData' | translate}}
      </fieldset>
      <fieldset class="flex space-x-4">
        <div class="w-3/6 flex flex-col">
          <label for="name" class="mb-2 font-semibold">{{'name' | translate}} </label>
          <div class="relative">
            <input formControlName="name" type="text" id="text" [ngClass]="inputClass(myFormPersonal,'name') "
              class="pl-7" />
            <div class="flex absolute inset-y-0 let-0 items-center pl-1 pointer-events-none">
              <i appIcon iconName="user-regular" [size]="'w-5 h-5'"
                [color]="'text-primary-600 dark:text-primary-400'"></i>
            </div>
          </div>
        </div>
        <div class="w-3/6 flex flex-col">
          <label for="lastname" class="mb-2 font-semibold">{{'lastname' | translate}}
          </label>
          <div class="relative">
            <input formControlName="lastname" type="text" id="text" [ngClass]="inputClass(myFormPersonal,'lastname')"
              class="pl-7" />
            <div class="flex absolute inset-y-0 let-0 items-center pl-1 pointer-events-none">
              <i appIcon iconName="user-regular" [size]="'w-5 h-5'"
                [color]="'text-primary-600 dark:text-primary-400'"></i>
            </div>
          </div>
        </div>
      </fieldset>
      <fieldset class="flex space-x-4">
        <div class="w-full flex flex-col">
          <label for="email" class="mb-2 font-semibold">
            {{'email' | translate}}
          </label>
          <div class="relative">
            <input formControlName="email" type="text" id="text" [ngClass]="inputClass(myFormPersonal,'email')"
              class="pl-7" />
            <div class="flex absolute inset-y-0 let-0 items-center pl-1 pointer-events-none">
              <i appIcon iconName="user-regular" [size]="'w-5 h-5'"
                [color]="'text-primary-600 dark:text-primary-400'"></i>
            </div>
          </div>
        </div>
      </fieldset>
      <fieldset class="flex space-x-4">
        <div class="w-3/6 flex flex-col">
          <label for="country" class="mb-2 font-semibold ">
            {{'country' | translate}}
          </label>
          <div class="relative">
            <select formControlName="country" (change)="onCountryState($event)"
              [ngClass]="selectClass(myFormPersonal,'country')">
              @for (item of countries(); track item) {
              <option value="{{item._id}}">
                {{item.name!}}</option>
              }
            </select>
          </div>
        </div>
        <div class="w-3/6 flex flex-col">
          <label for="countryState" class="mb-2 font-semibold ">
            {{'state' | translate}}
          </label>
          <div class="relative">
            <select formControlName="countryState" [ngClass]="selectClass(myFormPersonal,'countryState')">
              @for (item of countryStates(); track item) {
              <option value="{{item._id}}">
                {{item.name}}</option>
              }
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset class="flex flex-col space-y-4 md:flex-row md:space-y-0 md:space-x-4">
        <div class="w-full md:w-1/2 flex flex-col">
          <label for="city" class="mb-2 font-semibold">
            {{'city' | translate}}
          </label>
          <div class="relative">
            <input formControlName="city" type="text" id="city" [ngClass]="inputClass(myFormPersonal,'city')"
              class="w-full pl-7" />
            <div class="flex absolute inset-y-0 left-0 items-center pl-1 pointer-events-none">
              <i appIcon iconName="map-regular" [size]="'w-5 h-5'"
                [color]="'text-primary-600 dark:text-primary-400'"></i>
            </div>
          </div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col">
          <label for="address_line1" class="mb-2 font-semibold">
            {{ 'address' | translate }}
          </label>
          <div class="relative">
            <input formControlName="address_line1" type="text" id="address_line1"
              [ngClass]="inputClass(myFormPersonal,'address_line1')" class="w-full pl-7" />
            <div class="flex absolute inset-y-0 left-0 items-center pl-1 pointer-events-none">
              <i appIcon iconName="map-regular" [size]="'w-5 h-5'"
                [color]="'text-primary-600 dark:text-primary-400'"></i>
            </div>
          </div>
        </div>
      </fieldset>
      <fieldset class="flex flex-col space-y-4 md:flex-row md:space-y-0 md:space-x-4">
        <div class="w-full md:w-1/2 flex flex-col">
          <label for="postal_code" class="mb-2 font-semibold">
            {{'postalCode' | translate}}
          </label>
          <div class="relative">
            <input formControlName="postal_code" type="text" id="postal_code"
              [ngClass]="inputClass(myFormPersonal,'postal_code')" class="w-full pl-7" />
            <div class="flex absolute inset-y-0 left-0 items-center pl-1 pointer-events-none">
              <i appIcon iconName="map-pin-solid" [size]="'w-5 h-5'"
                [color]="'text-primary-600 dark:text-primary-400'"></i>
            </div>
          </div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col">
          <label for="phone" class="mb-2 font-semibold">
            {{ 'phone' | translate }}
          </label>
          <div
            class="flex justify-start items-center w-full bg-zinc-50 dark:bg-zinc-700 rounded-xl border border-zinc-100 dark:border-zinc-700">
            <div class="w-24 flex-shrink-0">
              <select formControlName="phonePrefix" [ngClass]="selectClass(myFormPersonal,'phonePrefix')"
                class="w-full pr-6 truncate  bg-no-repeat bg-right">
                @for (item of countries(); track item) {
                <option value="{{item.phonePrefix}}">
                  {{item.code}} {{ item.name!.length > 15 ? item.name!.substring(0, 15) + '...' : item.name }}
                </option>
                }
              </select>
            </div>
            <input id="prefix_preview" placeholder="+1" readonly
              [value]="$safeNavigationMigration(myFormPersonal.get('phonePrefix')?.value)"
              [ngClass]="{'w-12 flex-shrink-0 rounded-lg py-2 px-1 focus:outline-none focus:ring bg-zinc-50 dark:bg-zinc-700 focus:ring-zinc-200 active:ring-zinc-200 focus:dark:ring-zinc-700 active:ring active:dark:ring-zinc-700 pointer-events-none': true }">
            <input formControlName="phone" id="phone" [ngClass]="inputClass(myFormPersonal, 'phone')" autocomplete="off"
              class="w-full" />
          </div>
        </div>
      </fieldset>
      <fieldset class="flex justify-between space-x-5 mt-10">
        <button type="button" (click)="onCancelPersonalPay()" [ngClass]="buttonSecondaryClass()" class="w-full">
          <i appIcon iconName="close-regular" [size]="'w-6 h-6'" [color]="'text-white'"></i>
          {{'cancel' | translate}}
        </button>
        @if (!transaction()) {
        <button type="submit" [ngClass]="buttonPrimaryClass()"
          [disabled]="myFormPersonal.invalid || myFormPersonal.disabled" class="w-full">
          {{'continue' | translate}}
          <i appIcon iconName="arrow-forward-regular" [size]="'w-6 h-6'" [color]="'text-white'"></i>
        </button>
        }
      </fieldset>
    </form>
  </section>
</div>
}
