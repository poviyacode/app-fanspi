@if (capturedImage) {
<img [src]="capturedImage" alt="Captura">
}
<section @flyInOut [class]="cardClass()" class="p-4">

  <!-- CYBERSOURSE -->
  <form [formGroup]="myFormCyberSource" (submit)="onSubmitCyberSource()" class="block space-y-3">

    <fieldset class="w-1/2">
      <label for="StateCity" class="block mb-2 font-semibold text-lg">
        {{'card' | translate}}
      </label>
      <div class="relative">
        <select formControlName="card_type" [ngClass]="selectClass(myFormCyberSource,'card_type')"
          class="block w-full px-4 py-3">
          @for (item of cardTypes; track item) {
          <option [value]="item.value">{{item.name}}
          </option>
          }
        </select>
      </div>
    </fieldset>

    <fieldset class="w-full">
      <label for="card_number" class="block mb-2 font-semibold">
        {{'cardNumber' | translate}}
      </label>
      <div class="relative">
        <input formControlName="card_number" type="text" minlength="15" maxlength="19" id="card_number"
          [ngClass]="inputClass(myFormCyberSource,'card_number')" (input)="onCardNumberInput($event)"
          class="w-full py-3 px-2 placeholder:text-zinc-400/70 dark:placeholder:text-zinc-500/50"
          placeholder="0000 0000 0000 0000" />
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
          <i appIcon iconName="credit-card-regular" [size]="'w-6 h-6'"
            [color]="'text-primary-600 dark:text-primary-400'"></i>
        </div>
      </div>
    </fieldset>

    <fieldset class="flex space-x-4">
      <!-- <div class="input w-1/2">
          <label for="exp" class="block mb-2 font-semibold">
            {{'expirationDate' | translate}}
          </label>
          <div class="flex relative space-x-1">
            <div class="relative w-full">
              <select formControlName="card_expiry_mm"
                [ngClass]="selectClass(myFormCyberSource,'card_expiry_mm')" class="block w-full px-1 py-3">
                @for (item of cardExpiryMm; track item) {
                  <option [value]="item.value">
                  {{item.name}}</option>
                }
              </select>
            </div>
            <div class="relative w-full">
              <select formControlName="card_expiry_yy"
                [ngClass]="selectClass(myFormCyberSource,'card_expiry_yy')" class="block w-full px-1 py-3">
                @for (item of cardExpiryYy; track item) {
                  <option [value]="item.value">
                  {{item.name}}</option>
                }
              </select>
            </div>
          </div>
        </div> -->
      <div class="w-1/2 flex flex-col">
        <label for="card_expiry" class="mb-2 font-semibold block">
          {{ 'expirationDate' | translate }}
        </label>
        <div class="relative">
          <input id="card_expiry" type="text" placeholder="MM / AA" maxlength="7" inputmode="numeric"
            [ngClass]="inputClass(myFormCyberSource, 'card_expiry')" (input)="formatExpiryDate($event)"
            [formControl]="$any(myFormCyberSource.get('card_expiry'))" />
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
            <i appIcon iconName="date-range-regular" [size]="'w-5 h-5'"
              [color]="'text-primary-600 dark:text-primary-400'"></i>
          </div>
        </div>
      </div>
      <div class="input w-1/2">
        <label for="cvc" class="block mb-2 font-semibold">CVC</label>
        <div class="relative">
          <input formControlName="card_cvv" type="text" minlength="3" maxlength="4" id="card_cvv"
            [ngClass]="inputClass(myFormCyberSource,'card_cvv')"
            class="w-full py-3 px-2 placeholder:text-zinc-400/70 dark:placeholder:text-zinc-500/50" placeholder="000" />
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
            <i appIcon iconName="lock-solid" [size]="'w-5 h-5'" [color]="'text-primary-600 dark:text-primary-400'"></i>
          </div>
        </div>
      </div>
    </fieldset>

    <div class="flex justify-center mt-6">
      <img class="h-12" src="./public/images/logo_card.png" alt="Payment Methods">
    </div>

    @if (!transaction()) {
    <fieldset class="flex justify-between space-x-5 mt-10">
      <button type="button" (click)="onCancelTransaction()" [ngClass]="buttonSecondaryClass()" class="w-full">
        <i appIcon iconName="arrow-back-regular" [size]="'w-6 h-6'" [color]="'text-white'"></i>
        {{'return' | translate}}
      </button>
      <button type="submit" [ngClass]="buttonPrimaryClass()" class="w-full"
        [disabled]="myFormCyberSource.invalid || myFormCyberSource.disabled">
        <i appIcon iconName="lock-solid" [size]="'w-6 h-6'" [color]="'text-white'"></i>
        {{'payNow' | translate}}
      </button>
    </fieldset>

    <div class="text-center my-4 text-zinc-600  dark:text-zinc-300">
      <span class="text-sm">
        {{'securePaymentsProcessedBy' | translate}}
      </span>
      <a href="https://www.cybersource.com/" target="_blank" class="text-blue-500 hover:underline font-bold">
        Cybersource
      </a>
    </div>
    }

  </form>

  <!-- params cybersource -->
  @if (params) {
  <form ngNoForm action="{{this.endpotint}}" method="POST">
    @for (item of $safeNavigationMigration(params?.data) | keyvalue; track item) {
    <input type="hidden" id="{{item.key}}" name="{{item.key}}" value="{{item.value}}">
    }
    <input type="hidden" id="signature" name="signature" value="{{params.sign}}" />
    <input type="hidden" name="card_type" value="{{cardType}}">
    <!-- 001 visa, 002 mastercad-->
    <input type="hidden" name="card_number" value="{{cardNumber}}">
    <input type="hidden" name="card_expiry_date" value="{{this.cardExpiryDate}}">
    <input type="hidden" name="card_cvv" value="123">

    @if (transaction()) {
    <div class="my-10 space-y-5">

      <div
        class="relative overflow-hidden rounded-xl border border-zinc-200 bg-white p-4 shadow-sm transition-all hover:shadow-md dark:border-zinc-800 dark:bg-zinc-950 dark:hover:shadow-black/20">
        <div class="flex items-center gap-4">
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-amber-50 dark:bg-amber-950/40">
            <i appIcon iconName="info-circle-solid" [size]="'w-5 h-5'"
              [color]="'text-amber-600 dark:text-amber-500'"></i>
          </div>
          <div class="flex flex-col">
            <span class="text-[15px] font-medium leading-snug text-zinc-800 dark:text-zinc-200">
              {{'confirmTransactionPayment' | translate}}
            </span>
          </div>
        </div>
      </div>
      <div class="flex justify-center space-x-2 mt-10">
        <button (click)="onCancelTransaction()" type="button" [ngClass]="buttonSecondaryClass()" class="w-full">
          <i appIcon iconName="arrow-back-regular" [size]="'w-6 h-6'" [color]="'text-white'"></i>
          {{'return' | translate}}
        </button>
        <button type="submit" [ngClass]="buttonPrimaryClass()" class="w-full">
          <i appIcon iconName="lock-solid" [size]="'w-6 h-6'" [color]="'text-white'"></i>
          {{'transaction' | translate}}
        </button>
      </div>
    </div>
    }

  </form>
  }

</section>
