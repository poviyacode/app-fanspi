<section @flyInOut [class]="cardClass()" class="p-4">

    @if (qrData()) {
    <div class="mb-6 flex items-center justify-between">
        <div class="flex flex-col">
            <span class="text-[10px] font-black uppercase tracking-[0.2em] text-zinc-400">
                {{ 'scanQr' | translate }}
            </span>
            <div class="h-1 w-8 rounded-full bg-emerald-500/20 mt-1"></div>
        </div>

        <button (click)="downloadQr()" [ngClass]="buttonSecondaryClass()">
            <i appIcon iconName="download-regular" [size]="'w-4 h-4'" [color]="'text-white'"></i>
            <span>{{ 'download' | translate }}</span>
        </button>
    </div>

    <div
        class="group relative mx-auto flex max-w-fit items-center justify-center rounded-2xl bg-white p-6 shadow-[0_20px_50px_rgba(0,0,0,0.05)] transition-transform duration-500 hover:scale-[1.02] dark:bg-zinc-50">
        <div class="absolute -inset-2 rounded-[2rem] border border-emerald-500/10 dark:border-emerald-500/5"></div>

        <img [src]="getSafeQr($safeNavigationMigration(qrData()?.imagen))" alt="QR de Pago"
            class="relative h-56 w-56 object-contain mix-blend-multiply" />
    </div>

    <div class="mt-8 space-y-2 text-center">
        <div class="inline-flex items-baseline space-x-1">
            <span class="text-3xl font-black tracking-tight text-zinc-800 dark:text-zinc-100">
                {{ qrData()?.monto }}
            </span>
            <span class="text-sm font-bold text-emerald-600 dark:text-emerald-400">
                {{ qrData()?.moneda }}
            </span>
        </div>

        <div class="flex items-center justify-center space-x-2">
            <span class="h-px w-4 bg-zinc-200 dark:bg-zinc-700"></span>
            <p class="font-mono text-[11px] uppercase tracking-tighter text-zinc-400">
                ID: {{ qrData()?.numeroReferencia }}
            </p>
            <span class="h-px w-4 bg-zinc-200 dark:bg-zinc-700"></span>
        </div>
    </div>
    } @else {
    <div class="flex flex-col items-center space-y-4 py-12">
        <div class="h-56 w-56 animate-pulse rounded-2xl bg-zinc-100 dark:bg-zinc-800"></div>
        <div class="h-4 w-32 animate-pulse rounded bg-zinc-100 dark:bg-zinc-800"></div>
    </div>
    }
</section>
