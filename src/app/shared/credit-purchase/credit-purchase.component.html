@if (dialogService.activeModal() === 'creditPurchase') {
<div class="modal-center" (click)="closeModal()">
  <div
    class=" bg-white dark:bg-background-dark rounded-3xl shadow-lg border max-w-md mx-auto border-zinc-100 dark:border-zinc-800/40 "
    (click)="($event.stopPropagation())" @flyInOut>
    <div class="p-6">
      <div class="text-center text-3xl flex items-center justify-center space-x-2 font-semibold mb-5">
        <span>{{"getCoins" | translate}}</span>
      </div>

      <form [formGroup]="myform" id="form" novalidate autocomplete="off" (ngSubmit)="onSubmit()">

        <div class="grid grid-cols-1 gap-6">
          @for (item of this.productCreditService.productCredits(); track $index) {
          <label
            [ngClass]="{'bg-green-100 dark:bg-green-700  border-green-600 dark:border-green-400': myform.get('selectCredit')!.value === item.credit}"
            class="flex items-center justify-between space-x-8 sm:space-x-16 border dark:border-zinc-800 p-4 rounded-lg cursor-pointer transition-all duration-300 ease-in-out shadow-md hover:shadow-lg">
            <div class="flex items-center">
              <input type="radio" formControlName="selectCredit" name="selectCredit" [value]="item.credit"
                class="form-radio text-primary-600 absolute w-0 h-0 sr-only">
              <span appIcon iconName="povicoin-solid" [size]="'w-6 h-6'" class="mr-3"></span>
              <div>
                <p class="text-lg font-semibold text-zinc-900 dark:text-zinc-100">
                  {{ item.credit }} {{'coins' | translate}}</p>
                <p class="text-xs text-zinc-500 dark:text-zinc-200">{{'free' | translate}} {{item.bonus}}</p>
              </div>
            </div>
            <div>
              <p class="text-lg font-bold text-zinc-900 dark:text-zinc-100">
                {{ item.priceTotal | number:'1.2-2' }} USD
              </p>
            </div>
          </label>
          }

          <!-- Custom option -->
          <label
            [ngClass]="{'bg-green-100 dark:bg-green-700 border-green-600 dark:border-green-400': myform.get('selectCredit')!.value === 'custom'}"
            class="flex items-center justify-between space-x-8 sm:space-x-16 border dark:border-zinc-800 p-4 rounded-lg cursor-pointer transition-all duration-300 ease-in-out  shadow-md hover:shadow-lg">
            <div class="flex items-center">
              <input type="radio" formControlName="selectCredit" name="selectCredit" value="custom"
                class="form-radio text-primary-600 mr-3 absolute w-0 h-0 sr-only">
              <span appCoinSvg size="w-6 h-6" class="mr-3"></span>
              <div>
                <p class="text-lg font-semibold text-zinc-900 dark:text-zinc-100">{{'custom' | translate}}</p>
                <p class="text-xs text-zinc-500 dark:text-zinc-200">{{'free' | translate}} {{bonus()}}</p>
              </div>
            </div>

            <div class="relative">
              <input formControlName="credit" id="credit" type="text" [ngClass]="inputClass(myform, 'credit')">
              <div class="mt-1 text-xs text-zinc-500 dark:text-zinc-200">
                <span>{{ 'minimumBuyCoin' | translate: { x: 10.00, y: 500.00 } }}</span>
              </div>
            </div>
          </label>

        </div>

        <!-- Mostrar total calculado -->
        <div class="mt-4">
          <p class="text-lg font-bold text-zinc-900 dark:text-zinc-100">
            {{ 'total' | translate }}: {{ totalPrice() | number:'1.2-2' }} USD
          </p>
        </div>

        <div class="flex justify-center items-center space-x-5 mt-6 font-semibold">
          <button type="button"
            class="bg-zinc-200 hover:bg-zinc-300 dark:bg-zinc-700 dark:hover:bg-zinc-600 text-zinc-800 dark:text-zinc-200 py-2 px-6 rounded-lg shadow transition duration-200 ease-in-out"
            (click)="closeModal()">
            {{'cancel' | translate}}
          </button>
          <button type="submit" [ngClass]="myform.status === 'VALID' ? '' : 'opacity-50'"
            class="py-2 px-6 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg shadow transition duration-200 ease-in-out"
            [disabled]="myform.status !== 'VALID'">
            {{'Buy' | translate}}
            <span class="pl-2">
              <i class="fab fa-cc-visa"></i>
            </span>
            <span>
              <i class="fab fa-cc-mastercard"></i>
            </span>
          </button>
        </div>
      </form>
      <a href="" target="_parent">

      </a>
    </div>

  </div>
</div>
}
