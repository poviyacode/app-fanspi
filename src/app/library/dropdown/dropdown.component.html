<div class="dropdown" (onClose)="toggleMenu()">
  <button class="dropdown-toggle flex justify-between items-center text-zinc-500 dark:text-zinc-500 px-1" type="button"
    (click)="toggleMenu()">
    <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
  </button>
  <div
    class="dropdown-menu {{position == 'right' ? 'right-0' : position == 'left' ? 'left-0' : 'right-0' }} w-fit truncate border border-1 border-zinc-200 dark:border-zinc-800 bg-white dark:bg-background-dark rounded-md"
    [ngClass]="{'show': showMenu()}" [@menuAnimation] = "showMenu() ? 'visible' : 'hidden'">
    <ng-content></ng-content>
  </div>
</div>
